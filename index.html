<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AllcanceAI</title>
  <meta name="description" content="AllcanceAI — inteligência artificial sem interrupções com histórico de conversas e suporte a imagens." />

  <!-- Fonts: Syne (brand) + IBM Plex Mono (AI output) + IBM Plex Sans (UI) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=IBM+Plex+Mono:wght@300;400&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/style.css" />
  <!-- Supabase JS Client v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- ── Authentication Screen (Visible by default until session verified) ─── -->
  <div id="auth-screen">
    <div class="auth-card">
      <div class="auth-header">
        <img src="/assets/logo.jpg" alt="AllcanceAI" class="auth-logo" />
        <h1 class="auth-title">Acesso Restrito</h1>
        <p class="auth-subtitle">Digite suas credenciais para acessar a inteligência.</p>
      </div>

      <form id="auth-form" autocomplete="on">
        <div id="auth-error" class="auth-error-msg auth-hidden"></div>

        <div class="input-group">
          <label for="auth-email">E-mail</label>
          <input type="email" id="auth-email" placeholder="seu@email.com" required autocomplete="email" />
        </div>

        <div class="input-group">
          <label for="auth-password">Senha</label>
          <input type="password" id="auth-password" placeholder="••••••••" required autocomplete="current-password" />
        </div>

        <button type="submit" id="auth-submit-btn">
          <span id="auth-btn-text">Entrar</span>
          <span id="auth-btn-spinner" class="spinner auth-hidden"></span>
        </button>
      </form>
    </div>
  </div>

  <!-- ── Main App Container (Revealed when logged in) ───────────────────────── -->
  <div id="app-container" class="app-hidden">
    <!-- Sidebar for Chat History -->
    <aside id="chat-sidebar">
      <div class="sidebar-header">
        <button type="button" id="new-chat-btn" class="new-chat-button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span>Novo Chat</span>
        </button>
      </div>

      <div class="sidebar-content">
        <div class="sidebar-section-title">Histórico de Conversas</div>
        <div id="conversations-list" class="conversations-list" role="list">
          <!-- Dynamic conversation items -->
        </div>
      </div>

      <div class="sidebar-footer">
        <div class="user-info-chip">
          <div class="user-avatar-dot"></div>
          <span id="sidebar-user-email" class="user-email-text"></span>
        </div>
      </div>
    </aside>

    <!-- Sidebar backdrop on mobile -->
    <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

    <!-- Main Chat Column -->
    <div id="chat-wrapper">
      <!-- Header -->
      <header id="site-header">
        <div class="header-left">
          <button type="button" id="toggle-sidebar-btn" aria-label="Abrir histórico de conversas" title="Histórico">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>

          <a class="brand" href="/" aria-label="AllcanceAI">
            <img src="/assets/logo.jpg" alt="AllcanceAI" class="brand-logo" />
          </a>

          <div class="status-bar" id="status-bar" aria-live="polite">
            <span class="status-dot" id="status-dot"></span>
            <span class="status-label" id="status-label">Iniciando...</span>
          </div>
        </div>

        <div class="header-right" id="user-section">
          <button type="button" id="server-btn" aria-label="Configurar Servidor Backend" title="Configurar Servidor">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect>
              <rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect>
              <line x1="6" y1="6" x2="6.01" y2="6"></line>
              <line x1="6" y1="18" x2="6.01" y2="18"></line>
            </svg>
            <span id="server-btn-label">Servidor</span>
          </button>

          <button type="button" id="logout-btn" aria-label="Encerrar sessão" title="Sair da conta">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            <span>Sair</span>
          </button>
        </div>
      </header>

      <!-- Chat area -->
      <main id="chat-main">
        <div id="messages" role="log" aria-label="Conversa"></div>

        <!-- Empty state -->
        <div id="empty-state" aria-hidden="false">
          <p class="empty-headline">Como posso ajudar?</p>
        </div>
      </main>

      <!-- Input & Attachment -->
      <footer id="chat-footer">
        <div id="image-preview-container" class="preview-hidden">
          <div class="preview-card">
            <img id="preview-img" src="" alt="Prévia do anexo" />
            <button type="button" id="remove-img-btn" aria-label="Remover anexo">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>
        </div>

        <form id="chat-form" autocomplete="off">
          <input type="file" id="file-input" accept="image/png, image/jpeg, image/webp, image/gif" style="display: none;" />

          <button type="button" id="attach-btn" aria-label="Anexar imagem" title="Anexar imagem (ou cole com Ctrl+V)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
            </svg>
          </button>

          <textarea
            id="chat-input"
            name="message"
            placeholder="Mensagem ou cole uma imagem (Ctrl+V)..."
            rows="1"
            aria-label="Digite sua mensagem"
          ></textarea>

          <button type="submit" id="send-btn" aria-label="Enviar mensagem">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M10 17V3M10 3L4 9M10 3L16 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </form>
        <p class="footer-note">AllcanceAI pode cometer erros. Verifique informações importantes.</p>
      </footer>
    </div>
  </div>

  <!-- ── Image Lightbox Modal ───────────────────────────────────────────────── -->
  <div id="image-modal" class="modal-hidden">
    <div class="modal-backdrop" id="modal-backdrop"></div>
    <div class="modal-content">
      <img id="modal-img" src="" alt="Imagem ampliada" />
      <button type="button" id="modal-close" aria-label="Fechar">✕</button>
    </div>
  </div>

  <!-- ── Server Config Modal ────────────────────────────────────────────────── -->
  <div id="server-modal" class="modal-hidden">
    <div class="modal-backdrop" id="server-modal-backdrop"></div>
    <div class="server-modal-card">
      <div class="server-modal-header">
        <h2 class="server-modal-title">Conexão do Servidor</h2>
        <button type="button" id="server-modal-close" class="server-modal-close-btn" aria-label="Fechar">✕</button>
      </div>
      <p class="server-modal-desc">Defina a URL do seu backend local ou túnel para conectar a IA.</p>

      <div class="input-group">
        <label for="backend-url-input">URL do Backend</label>
        <input type="text" id="backend-url-input" placeholder="http://localhost:3000" />
      </div>

      <div id="server-test-feedback" class="server-feedback auth-hidden"></div>

      <div class="server-modal-actions">
        <button type="button" id="server-test-btn" class="secondary-action-btn">Testar</button>
        <button type="button" id="server-save-btn" class="primary-action-btn">Salvar</button>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
